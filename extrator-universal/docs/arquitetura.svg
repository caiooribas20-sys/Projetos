<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#132a2a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="560" rx="18" fill="url(#bg)"/>
  <text x="40" y="52" fill="#f8fafc" font-size="24" font-weight="700">Extrator Universal (ChatOps) · fluxo de dados</text>
  <text x="40" y="78" fill="#94a3b8" font-size="14">Pedido em linguagem natural → fonte oficial → prévia privada → confirmação → camadas Bronze / Silver / Gold</text>

  <!-- coluna 1: entrada -->
  <g>
    <rect x="40" y="120" width="200" height="110" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="60" y="150" fill="#5eead4" font-size="12" font-weight="700" letter-spacing="1">ENTRADA</text>
    <text x="60" y="176" fill="#f1f5f9" font-size="15" font-weight="600">Terminal ChatOps</text>
    <text x="60" y="198" fill="#94a3b8" font-size="12.5">"extrair matrículas por</text>
    <text x="60" y="215" fill="#94a3b8" font-size="12.5">escola no INEP"</text>

    <rect x="40" y="260" width="200" height="90" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="60" y="290" fill="#5eead4" font-size="12" font-weight="700" letter-spacing="1">UPLOAD / n8n</text>
    <text x="60" y="314" fill="#f1f5f9" font-size="15" font-weight="600">CSV · TSV · webhook</text>
    <text x="60" y="334" fill="#94a3b8" font-size="12.5">ingestão idempotente</text>

    <rect x="40" y="380" width="200" height="90" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="60" y="410" fill="#5eead4" font-size="12" font-weight="700" letter-spacing="1">CONSULTA</text>
    <text x="60" y="434" fill="#f1f5f9" font-size="15" font-weight="600">Text-to-SQL seguro</text>
    <text x="60" y="454" fill="#94a3b8" font-size="12.5">spec validado (zod)</text>
  </g>

  <!-- coluna 2: pipeline de extração -->
  <g>
    <rect x="290" y="120" width="330" height="350" rx="14" fill="#0b1220" stroke="#14b8a6" stroke-dasharray="5 4"/>
    <text x="310" y="150" fill="#5eead4" font-size="12" font-weight="700" letter-spacing="1">EXTRAÇÃO EM ETAPAS (server functions)</text>
    <g font-size="14" fill="#f1f5f9">
      <rect x="310" y="168" width="290" height="44" rx="9" fill="#1e293b"/><text x="326" y="195">1 · Classificar pedido — Groq (LLM)</text>
      <rect x="310" y="222" width="290" height="44" rx="9" fill="#1e293b"/><text x="326" y="249">2 · Buscar fonte oficial — Serper</text>
      <rect x="310" y="276" width="290" height="44" rx="9" fill="#1e293b"/><text x="326" y="303">3 · Ler — parser CSV/XLSX/ZIP · Jina</text>
      <rect x="310" y="330" width="290" height="44" rx="9" fill="#1e293b"/><text x="326" y="357">4 · Estruturar + contrato de linhas</text>
      <rect x="310" y="384" width="290" height="44" rx="9" fill="#134e4a"/><text x="326" y="411">5 · Prévia privada → Confirmar</text>
    </g>
    <text x="310" y="452" fill="#94a3b8" font-size="12">allowlist de domínios oficiais · sem redirects · SHA-256</text>
  </g>

  <!-- coluna 3: medalhão -->
  <g>
    <rect x="670" y="120" width="250" height="350" rx="14" fill="#0b1220" stroke="#334155"/>
    <text x="690" y="150" fill="#5eead4" font-size="12" font-weight="700" letter-spacing="1">POSTGRESQL (SUPABASE) + RLS</text>
    <rect x="690" y="168" width="210" height="80" rx="10" fill="#78350f"/>
    <text x="706" y="198" fill="#fef3c7" font-size="16" font-weight="700">Bronze</text>
    <text x="706" y="222" fill="#fde68a" font-size="12.5">snapshot bruto deduplicado</text>
    <rect x="690" y="262" width="210" height="80" rx="10" fill="#475569"/>
    <text x="706" y="292" fill="#f8fafc" font-size="16" font-weight="700">Silver</text>
    <text x="706" y="316" fill="#e2e8f0" font-size="12.5">contrato: Data_Ref ISO 8601</text>
    <rect x="690" y="356" width="210" height="80" rx="10" fill="#a16207"/>
    <text x="706" y="386" fill="#fefce8" font-size="16" font-weight="700">Gold</text>
    <text x="706" y="410" fill="#fef9c3" font-size="12.5">agregação via RPC no banco</text>
  </g>

  <!-- coluna 4: consumo -->
  <g>
    <rect x="970" y="120" width="190" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="988" y="152" fill="#f1f5f9" font-size="15" font-weight="600">Analytics (Canvas)</text>
    <text x="988" y="174" fill="#94a3b8" font-size="12.5">gráficos sobre a Silver</text>
    <rect x="970" y="220" width="190" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="988" y="252" fill="#f1f5f9" font-size="15" font-weight="600">Exportações</text>
    <text x="988" y="274" fill="#94a3b8" font-size="12.5">CSV · metadados · Jupyter</text>
    <rect x="970" y="320" width="190" height="80" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="988" y="352" fill="#f1f5f9" font-size="15" font-weight="600">Power BI</text>
    <text x="988" y="374" fill="#94a3b8" font-size="12.5">modelo estrela (Gold)</text>
    <rect x="970" y="420" width="190" height="50" rx="12" fill="#1e293b" stroke="#334155"/>
    <text x="988" y="451" fill="#f1f5f9" font-size="15" font-weight="600">Observabilidade</text>
  </g>

  <!-- setas -->
  <g stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a)">
    <path d="M240 175 H288"/>
    <path d="M240 305 H 265 V 490 H 645 V 228 H 688"/>
    <path d="M240 425 H 255 V 500 H 660 V 410 H 688"/>
    <path d="M620 406 H 650 V 198 H 688"/>
    <path d="M795 248 V 260"/>
    <path d="M795 342 V 354"/>
    <path d="M900 302 H 940 V 160 H 968"/>
    <path d="M900 396 H 950 V 260 H 968"/><path d="M950 360 H 968"/><path d="M950 396 V 445 H 968"/>
  </g>

  <text x="40" y="525" fill="#64748b" font-size="12.5">TanStack Start · React 19 · TypeScript · Tailwind/shadcn · Supabase (PostgreSQL, Auth, RLS) · Drizzle · Groq · Serper · Jina Reader · n8n</text>
</svg>
